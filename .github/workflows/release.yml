name: Release Crucible SUX Leveler

# Tag exactly vX.Y.Z (or vX.Y.Z-rcN) where csproj Version is X.Y.Z.0.
# A stable tag publishes latest.zip first, then updates pluginmaster.json on main.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Check tag format
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-rc\d+)?$') {
            Write-Host "::error::Tag must be vX.Y.Z or vX.Y.Z-rcN, got $env:TAG"
            exit 1
          }
          $prerelease = [bool]$Matches[2]
          "RELEASE_TAG=$env:TAG" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_PRERELEASE=$($prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate version, fork identity and URLs
        shell: pwsh
        run: |
          python tools/validate_fork_release.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile tools/make_pluginmaster.py tools/validate_fork_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:RUNNER_TEMP\dalamud"
          "DALAMUD_HOME=$env:RUNNER_TEMP\dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and test the fork
        shell: pwsh
        run: |
          dotnet build CrucibleSux/CrucibleSux.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project CrucibleSux.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged DLL and embedded manifest
        shell: pwsh
        run: |
          # In .NET 10, the package can be below bin/Release or bin/x64/Release.
          $zips = @(Get-ChildItem -Path 'CrucibleSux/bin' -Recurse -File -Filter latest.zip |
            Where-Object { $_.Directory.Name -eq 'CrucibleSuxLeveler' } |
            Sort-Object LastWriteTimeUtc -Descending)
          if ($zips.Count -lt 1) {
            Write-Host '::error::No CrucibleSuxLeveler/latest.zip found after build'
            exit 1
          }
          $zip = $zips[0].FullName
          $extract = Join-Path $env:RUNNER_TEMP 'cruciblesuxleveler-package'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract 'CrucibleSuxLeveler.dll'
          $manifestFile = Join-Path $extract 'CrucibleSuxLeveler.json'
          if (-not (Test-Path $dll) -or -not (Test-Path $manifestFile)) {
            Write-Host '::error::The zip must include CrucibleSuxLeveler.dll and CrucibleSuxLeveler.json at its root'
            exit 1
          }
          $manifest = Get-Content $manifestFile -Raw | ConvertFrom-Json
          $version = ([xml](Get-Content CrucibleSux/CrucibleSux.csproj -Raw)).Project.PropertyGroup.Version
          if ($manifest.InternalName -ne 'CrucibleSuxLeveler' -or
              $manifest.Name -ne 'Crucible SUX Leveler' -or
              $manifest.AssemblyVersion -ne $version -or
              $manifest.RepoUrl -ne "https://github.com/$env:GITHUB_REPOSITORY") {
            Write-Host '::error::The packaged manifest is not this fork, version or repository'
            exit 1
          }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumFile = Join-Path $zips[0].Directory.FullName 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sumFile, "$zipHash  latest.zip`n$dllHash  CrucibleSuxLeveler.dll`n")
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @(
            "## Crucible SUX Leveler $env:RELEASE_TAG", '',
            'Fork-specific changes are documented in FORK_CHANGELOG.md.', '',
            '### SHA-256', '',
            "- latest.zip: ``$zipHash``",
            "- CrucibleSuxLeveler.dll: ``$dllHash``", '',
            "Source: https://github.com/$env:GITHUB_REPOSITORY"
          ) | Set-Content -Path $notesFile -Encoding utf8
          "PACKAGE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_SUMS=$sumFile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGED_MANIFEST=$manifestFile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NOTES_PATH=$notesFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Crucible SUX Leveler ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SUMS }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          generate_release_notes: true

      - name: Generate fork-only pluginmaster.json
        if: env.RELEASE_PRERELEASE == 'false'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pluginmaster-fork.json'
          python tools/make_pluginmaster.py --tag "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --manifest "$env:PACKAGED_MANIFEST" --output "$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GENERATED_PLUGINMASTER=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update pluginmaster.json on main
        if: env.RELEASE_PRERELEASE == 'false'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $env:GENERATED_PLUGINMASTER pluginmaster.json -Force
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'pluginmaster.json already current'; exit 0 }
          git commit -m "chore: publish Crucible SUX Leveler $env:RELEASE_TAG manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              Write-Host '::error::Concurrent pluginmaster change; resolve on main manually'
              exit 1
            }
          }
          Write-Host '::error::Failed to push pluginmaster.json to main after 3 attempts'
          exit 1
